name: Continuous Integration

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test-and-lint:
    name: Test and lint (Node.js version:${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Invert the boolean below to use multiple or single matrix strategy mode
        # This could be improved upon in such a way that this workflow does not have to be edited to achieve the desired mode
        node-version: ${{ fromJSON(false && '[18, 20, 24]' || '[20]')}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - parallel:
        - name: Run linting
          run: npm run lint
        - name: Run tests
          run: npm run test

      - parallel:
        # To configure Codecov the following guide was used: https://docs.codecov.com/docs/github-tutorial
        - name: Codecov integration
          uses: codecov/codecov-action@v7.1.1
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            flags: node-version-${{ matrix.node-version }}
            name: coverage-node-version-${{ matrix.node-version }}
        - name: Upload code coverage build artifact
          uses: actions/upload-artifact@v7.0.2
          with:
            name: coverage-report
            path: coverage/

# It probably doesn't make sense to include this in the ci.yaml but I put this here for demonstration purposes
  deploy:
    name: Deploy to production
    needs: [ test-and-lint ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "Simulating deployment..."
          sleep 3
          echo "Done!"